spring.application.name=kanban

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/qlcv?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Bangkok}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.locations=classpath:db/migration

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:change-this-dev-only-secret-key-at-least-64-characters-long-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:18000000}
app.jwt.reset-expiration-ms=${JWT_RESET_EXPIRATION_MS:900000}

app.mail.host=${MAIL_HOST:smtp.gmail.com}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@localhost}}
app.mail.protocol=${MAIL_PROTOCOL:smtp}
app.mail.smtp-auth=${MAIL_SMTP_AUTH:true}
app.mail.starttls-enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
app.mail.debug=${MAIL_DEBUG:false}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

app.jwt.invalidate-on-startup=${JWT_INVALIDATE_ON_STARTUP:true}
