spring.datasource.url=jdbc:h2:mem:kanban_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
app.jwt.secret=test-secret-key-at-least-64-characters-long-for-hs512-signing-1234567890
app.jwt.expiration-ms=18000000
app.jwt.reset-expiration-ms=900000
app.jwt.invalidate-on-startup=false
app.cors.allowed-origins=http://localhost:5173
